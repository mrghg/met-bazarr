name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install (with iris for the synthetic UM tests)
        run: uv sync --extra um
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests (synthetic data only)
        run: uv run pytest
