[project]
name = "metbazarr"
version = "0.4.0"
description = "Prepare meteorology as compressed Zarr stores for atmospheric transport models."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Matt Rigby" },
]
dependencies = [
    "dask>=2026.8.0",
    "numcodecs>=0.16.6",
    # Add runtime dependencies here, or use: uv add <package>
    "numpy>=2.4.6",
    "pyyaml>=6.0.3",
    "xarray>=2026.7.0",
    "zarr>=3",
]

[project.optional-dependencies]
# Example: install the scientific stack with `uv sync --extra science`
science = [
    "numpy",
    "scipy",
    "pandas",
    "xarray",
    "matplotlib",
]
# Met Office UM files. WGDOS-packed files also need mo_pack, which is on
# conda-forge only: see docs/setup.md ("Met Office UM on JASMIN").
um = [
    "scitools-iris>=3.14.1",
]
# ERA5 from the ARCO stores on Google Cloud (anonymous gs:// access).
arco = [
    "gcsfs>=2026.10.1",
]

[project.scripts]
metbazarr = "metbazarr.cli:main"

[dependency-groups]
# Dev tooling — installed by `uv sync`, excluded from published builds.
dev = [
    "ruff",
    "pre-commit",
    "pytest>=9.2.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "metbazarr"
module-root = "src"

# ---------------------------------------------------------------------------
# Ruff — linter + formatter. https://docs.astral.sh/ruff/
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# A pragmatic set for scientific code. Add/remove as suits the project.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modern syntax)
    "B",    # flake8-bugbear (likely bugs)
    "SIM",  # flake8-simplify
    "NPY",  # NumPy-specific rules
    "PD",   # pandas-vet
]
ignore = [
    "E501",  # line length — handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# Notebooks and exploratory scripts get more slack.
"notebooks/*" = ["E402", "F401", "F811"]
"scripts/*" = ["T20"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
