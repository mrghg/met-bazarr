# Example: one day of ERA5 from the ARCO copy on Google Cloud (source era5_arco),
# over a Europe box, in the glide format. Needs the arco extra
# (uv sync --extra arco) and $METBAZARR_OUT set to an output directory.
#   uv run metbazarr build examples/recipes/era5-arco-day.yaml --step plan
format: glide
output: $METBAZARR_OUT/EUR_20190108-20190108_ERA5-ARCO.zarr
domain: {name: EUR, lon_min: -30, lon_max: 40, lat_min: 32, lat_max: 72}
period: {start: "2019-01-08T00:00", end: "2019-01-08T23:00"}
source: {type: era5_arco}
compression: {codec: zstd, level: 5}
chunks: {tile: 128}
